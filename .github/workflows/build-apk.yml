name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "JAVA_HOME: $JAVA_HOME"
          java -version
          JAVA_MAJOR=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F '.' '{print $1}')
          echo "Detected Java major version: $JAVA_MAJOR"
          if [ -z "$JAVA_MAJOR" ]; then
            echo "Error: Could not detect active Java major version."
            exit 1
          fi
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "Error: Java major version is $JAVA_MAJOR. Version 17 or newer is required."
            exit 1
          fi
          echo "Java 17 or newer environment verified successfully."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "./debug.keystore already exists."
          else
            echo "Creating temporary debug keystore..."
            keytool -genkeypair -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "Error: ./debug.keystore could not be created or found."
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: Expected APK file does not exist: $EXPECTED_APK"
            echo "Searching only inside app/build/outputs/apk for any generated APKs:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "Error: $EXPECTED_APK exists but is empty."
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *)
              echo "Error: $EXPECTED_APK does not have the .apk extension."
              exit 1
              ;;
          esac

          echo "APK verification passed: $EXPECTED_APK is a valid, non-empty APK file."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          RELEASE_TMP_DIR="${RUNNER_TEMP}/release_assets"
          mkdir -p "$RELEASE_TMP_DIR"

          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SANITIZED_NAME=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g' | sed -E 's/^-+|-+$//g')
          if [ -z "$SANITIZED_NAME" ]; then
            SANITIZED_NAME="app"
          fi

          RELEASE_FILENAME="${SANITIZED_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          RELEASE_FILEPATH="${RELEASE_TMP_DIR}/${RELEASE_FILENAME}"

          cp "app/build/outputs/apk/debug/app-debug.apk" "$RELEASE_FILEPATH"

          if [ ! -f "$RELEASE_FILEPATH" ] || [ ! -s "$RELEASE_FILEPATH" ]; then
            echo "Error: Failed to prepare release asset at $RELEASE_FILEPATH"
            exit 1
          fi

          echo "asset_path=$RELEASE_FILEPATH" >> "$GITHUB_OUTPUT"
          echo "asset_filename=$RELEASE_FILENAME" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: $RELEASE_FILEPATH"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Release asset '$ASSET_PATH' does not exist or is empty."
            exit 1
          fi

          case "$ASSET_PATH" in
            *.apk) ;;
            *)
              echo "Error: Release asset '$ASSET_PATH' is not an .apk file."
              exit 1
              ;;
          esac

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          RELEASE_NOTES="### Automated Debug Build
          - **Build Type**: Automatically generated debug APK
          - **Builder**: GitHub Actions
          - **Run Number**: ${GITHUB_RUN_NUMBER}
          - **Run Attempt**: ${GITHUB_RUN_ATTEMPT}
          - **Source Commit**: ${GITHUB_SHA}
          - **Intended Use**: Testing and development
          - **Production Notice**: This is not a Play Store production release
          - **Signing**: Signed with temporary debug keystore"

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OUTCOME="${{ steps.publish_release.outcome }}"
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          ASSET_FILENAME="${{ steps.prepare_asset.outputs.asset_filename }}"

          if [ "$OUTCOME" = "success" ]; then
            echo "GitHub Release published successfully."
            gh release view "$RELEASE_TAG"
            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url -q .url)
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: Debug APK Build #${GITHUB_RUN_NUMBER}"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_FILENAME"

            {
              echo "## 🚀 Debug APK Build & Release Succeeded"
              echo ""
              echo "- **Release Tag**: \`$RELEASE_TAG\`"
              echo "- **Release Page**: [$RELEASE_URL]($RELEASE_URL)"
              echo "- **APK Filename**: \`$ASSET_FILENAME\`"
              echo ""
              echo "### Direct Phone Download"
              echo "You can download and install the debug APK directly from the **Assets** section of the [GitHub Release]($RELEASE_URL)."
              echo ""
              echo "*Backup: The standard GitHub Actions artifact (\`app-debug-apk\`) is also preserved in the workflow summary.*"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing was not completed. However, the APK build succeeded and is safely stored as an Actions artifact."
            echo "Artifact 'app-debug-apk' remains available."

            {
              echo "## ⚠️ Debug APK Build Succeeded (Release Publishing Notice)"
              echo ""
              echo "The debug APK was successfully built and verified."
              echo "Direct GitHub Release creation was bypassed or encountered an issue."
              echo ""
              echo "### Download the APK"
              echo "The debug APK is preserved and available under the **Artifacts** section of this workflow run:"
              echo "- **Artifact Name**: \`app-debug-apk\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
